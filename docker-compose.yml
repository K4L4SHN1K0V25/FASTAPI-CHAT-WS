services:
  redis:
    image: redis:alpine
    container_name: chat_redis

  auth-service:
    image: tu_usuario_dockerhub/fastapi-chat-auth:latest
    container_name: auth_fastapi
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

chat-backend:
    image: tu_usuario_dockerhub/fastapi-chat-backend:latest # 👈 Descarga la imagen pre-compilada
    container_name: chat_fastapi
    environment:
      - REDIS_URL=redis://redis:6379