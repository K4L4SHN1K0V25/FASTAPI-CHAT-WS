server {
    listen 80;
    server_name localhost;

    # 1. Servir el Frontend (Archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Desviar el tráfico del WebSocket al contenedor de FastAPI
    location /ws/ {
        proxy_pass http://chat-backend:8000; # Nombre del servicio en docker-compose
        proxy_http_version 1.1;
        
        # Cabeceras obligatorias para que el protocolo cambie de HTTP a WebSocket (Handshake)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}