name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # TRABAJO 1: Integración Continua (Correr los tests)
  test-auth:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias del Auth Service
      run: |
        python -m pip install --upgrade pip
        pip install -r auth_service/requirements.txt

    - name: 🧪 Ejecutar pruebas unitarias con Pytest
      run: |
        pytest auth_service/test_auth.py

  # TRABAJO 2: Despliegue Continuo (Compilar y empaquetar en Docker Hub)
  build-and-package:
    needs: test-auth # Espera a que las pruebas pasen en verde primero
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configurar Docker Buildx (Optimizador de velocidad de compilación)
      uses: docker/setup-buildx-action@v3

    # 🐳 1. Compilar y subir el servicio de Autenticación
    - name: Compilar y subir Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth_service
        file: ./auth_service/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-chat-auth:latest

    # 🐳 2. Compilar y subir el servicio del Chat Backend
    - name: Compilar y subir Chat Backend
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-chat-backend:latest